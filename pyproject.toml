[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=61.2" ]

[project]
name = "bt_mesh_ctrl"
description = "Control tools for BLE Mesh network"
readme.content-type = "text/markdown"
readme.file = "README.md"
license = { text = "GPL-2.0-or-later" }
authors = [ { name = "Alexander Ozumenko" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "docopt",
  "PyYAML",
  "aozyumenko_bluetooth_mesh>=1.3.1",
  "bluetooth_numbers",
  "construct==2.9.45.post4",
]
urls = { Homepage = "https://github.com/aozyumenko/bt_mesh_ctrl" }
scripts.bt_mesh_ctrl_health = "bt_mesh_ctrl.cli_health:cli"
scripts.bt_mesh_ctrl_switch = "bt_mesh_ctrl.cli_switch:cli"
scripts.bt_mesh_ctrl_sensor = "bt_mesh_ctrl.cli_sensor:cli"

[tool.setuptools.dynamic]
version = { attr = "bt_mesh_ctrl.version.__version__" }
